name: Android APK Build

# Define os gatilhos que vão rodar o pipeline
on:
  push:
    branches: [ "main", "master" ] # Roda ao enviar código para estas branches
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar o build manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-latest # Executa o pipeline em uma máquina Linux limpa

    steps:
    # 1. Clona o código do repositório na máquina virtual
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Configura o ambiente Java (essencial para o Gradle)
    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle # Ativa o cache para acelerar os próximos builds

    # 3. Dá permissão de execução para o script do Gradle
    - name: Conceder permissão ao gradlew
      run: chmod +x gradlew

    # 4. Executa a compilação e gera o arquivo APK
    - name: Compilar APK de Debug
      run: ./gradlew assembleDebug

    # 5. Salva o APK gerado para que você consiga baixá-lo no painel do GitHub
    - name: Fazer upload do APK (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
